services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network so Postgres is on localhost,
    # matching the DATABASE_URL used everywhere else.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: strength
      POSTGRES_PASSWORD: strength
      POSTGRES_DB: strength_app
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
